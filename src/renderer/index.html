<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Screen Share</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --success-color: #10b981;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Keyframe Animations for Soft Smooth Transitions */
    @keyframes fadeInSlideUp {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Custom Integrated Header / Titlebar - Fully Responsive */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      -webkit-app-region: drag;
      min-height: 44px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .btn-new-win {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease-out;
      white-space: nowrap;
    }

    .btn-new-win:hover {
      background: rgba(99, 102, 241, 0.3);
      color: white;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.4s ease-out;
    }

    .status-badge.hosting {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.25);
    }

    .status-badge.expired {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-color);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    .status-dot.hosting {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .status-dot.expired {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.6; transform: scale(0.9); }
    }

    /* Window Controls */
    .window-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease-out;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .win-btn-close:hover {
      background: #ef4444 !important;
      color: white !important;
    }

    /* App Body - Responsive Layout */
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 2vh, 20px) clamp(12px, 3vw, 24px);
      overflow-y: auto;
      gap: 12px;
    }

    /* Segmented Tab Controls - Soft Fade Transition */
    .nav-tabs {
      display: flex;
      align-self: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      gap: 4px;
      width: 100%;
      max-width: 480px;
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: clamp(0.75rem, 1.5vw, 0.82rem);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.35s ease-out, color 0.35s ease-out, box-shadow 0.35s ease-out;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .compact-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: clamp(14px, 2vh, 20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .card-title {
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      font-weight: 700;
    }

    .card-subtitle {
      font-size: clamp(0.72rem, 1.5vw, 0.78rem);
      color: var(--text-muted);
      margin-top: 1px;
    }

    .sources-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.3s ease-out;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .source-card {
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease-out;
      position: relative;
    }

    .source-card:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }

    .source-card.selected {
      border-color: #818cf8;
      background: rgba(99, 102, 241, 0.25);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
    }

    .source-card img {
      width: 100%;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
    }

    .source-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #a78bfa;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .source-card span {
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .info-note {
      font-size: 0.74rem;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      line-height: 1.3;
    }

    .toggle-group {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(15, 23, 42, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .toggle-label input[type="checkbox"] {
      accent-color: #6366f1;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .btn {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: clamp(0.85rem, 1.8vw, 0.92rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease-out;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      width: 100%;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      box-shadow: none;
      width: auto;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-danger {
      background: var(--danger-color);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      width: auto;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .code-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px dashed rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .code-val {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: #a78bfa;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 14px rgba(167, 139, 250, 0.4);
      word-break: break-all;
    }

    .code-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: #f8fafc;
      text-align: center;
      outline: none;
      transition: all 0.3s ease-out;
      font-family: 'Courier New', monospace;
      user-select: text;
    }

    .code-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.3);
    }

    /* Active Session Fullscreen Stream View */
    .session-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: black;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--glass-border);
      animation: fadeInSlideUp 0.5s ease-out forwards;
    }

    .video-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 82vh;
      object-fit: contain;
    }

    /* Active Session Stream View Controls - Ultra Modern & Compact */
    .control-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 5px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 10;
      animation: fadeInSlideUp 0.45s ease-out forwards;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease-out;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .ctrl-btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .ctrl-btn-danger:hover {
      background: rgba(239, 68, 68, 0.85);
      color: white;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    /* Ultra-Modern Glassmorphic Modal Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.78);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeInSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 22px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      animation: fadeInSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-icon {
      width: 32px;
      height: 32px;
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-body {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .brand-title { display: none; }
      .btn-new-win { font-size: 0.7rem; padding: 3px 6px; }
      .control-bar { bottom: 10px; padding: 4px 8px; gap: 6px; }
      .ctrl-btn { font-size: 0.7rem; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="index.js"></script>
</body>
</html>
