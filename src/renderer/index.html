<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Screen Share</title>
  <style>
    :root, [data-theme="dark-glass"] {
      --bg-gradient: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --success-color: #10b981;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.75);
    }
    [data-theme="light-glass"] {
      --bg-gradient: radial-gradient(circle at top left, #e0e7ff 0%, #f1f5f9 60%, #cbd5e1 100%);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.12);
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --accent-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      --success-color: #059669;
      --danger-color: #dc2626;
      --text-main: #0f172a;
      --text-muted: #475569;
      --card-bg: rgba(255, 255, 255, 0.9);
    }
    [data-theme="dark"] {
      --bg-gradient: #090d16;
      --glass-bg: #1e293b;
      --glass-border: #334155;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --success-color: #10b981;
      --danger-color: #ef4444;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --card-bg: #0f172a;
    }
    [data-theme="light"] {
      --bg-gradient: #f8fafc;
      --glass-bg: #ffffff;
      --glass-border: #cbd5e1;
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --accent-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      --success-color: #059669;
      --danger-color: #dc2626;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Navbar Dropdown Menu */
    .navbar-menu-wrapper {
      position: relative;
      display: inline-block;
    }
    .btn-navbar-menu {
      background: rgba(30, 41, 59, 0.8);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-navbar-menu:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .navbar-dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 230px;
      background: rgba(30, 41, 59, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 6px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeInSlideUp 0.15s ease-out;
    }
    .dropdown-item {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.15s;
    }
    .dropdown-item:hover {
      background: rgba(99, 102, 241, 0.2);
      color: white;
    }
    .dropdown-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 0;
    }
    .dropdown-label {
      font-size: 0.72rem;
      color: #94a3b8;
      padding: 4px 10px 2px 10px;
      font-weight: 600;
    }
    .signaling-select-dropdown {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.78rem;
    }
    /* Live Closed Caption Subtitle Overlay */
    .closed-caption-banner {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 80%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 900;
      animation: fadeInSlideUp 0.2s ease-out;
    }
    .cc-badge {
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .cc-speaker {
      font-size: 0.85rem;
      font-weight: 700;
      color: #818cf8;
    }
    .cc-text {
      font-size: 0.95rem;
      color: #f8fafc;
      font-weight: 500;
    }
    .cc-partial {
      color: #cbd5e1;
      font-style: italic;
    }
    .cc-final {
      color: #ffffff;
    }

    /* Dark Glassmorphism Sidebar Settings Modal (Matching App UI) */
    .settings-modal-card-dark {
      width: 840px;
      height: 580px;
      max-width: 95vw;
      max-height: 90vh;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      overflow: hidden;
      font-family: inherit;
    }
    .settings-sidebar-dark {
      width: 240px;
      background: rgba(30, 41, 59, 0.7);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .settings-search-box-dark {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 10px;
      gap: 6px;
    }
    .settings-search-box-dark input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 0.85rem;
      color: #f8fafc;
    }
    .settings-nav-group-dark {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-group-label-dark {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      padding: 4px 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .settings-nav-item-dark {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .settings-nav-item-dark:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }
    .settings-nav-item-dark.active {
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(129, 140, 248, 0.4);
      color: #ffffff;
      font-weight: 600;
    }
    .settings-main-content-dark {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.5);
    }
    .settings-close-btn-dark {
      position: absolute;
      top: 14px;
      right: 18px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: #94a3b8;
      cursor: pointer;
      z-index: 10;
    }
    .settings-close-btn-dark:hover {
      color: #ffffff;
    }
    .settings-content-scroll-dark {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .tab-title-dark {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .form-group-card-dark {
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px;
    }
    .avatar-row-dark {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .avatar-circle-dark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .form-field-dark {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field-dark label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .form-field-dark input,
    .form-field-dark select,
    .form-field-dark textarea {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.88rem;
      color: #f8fafc;
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      transition: border-color 0.15s;
    }
    .form-field-dark input:focus,
    .form-field-dark select:focus,
    .form-field-dark textarea:focus {
      border-color: #818cf8;
    }
    .field-hint-dark {
      font-size: 0.76rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .checkbox-row-dark {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
    }
    .settings-footer-dark {
      padding: 16px 36px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
    }
    .btn-cancel-dark {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save-dark {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 8px 22px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .skill-pill-dark {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      color: #e2e8f0;
      font-weight: 500;
    }
    .mcp-server-item-dark {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }



    /* Settings Panel Glassmorphism Modal */

    .settings-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeInSlideUp 0.25s ease-out;
    }
    .settings-modal-card {
      width: 540px;
      max-width: 90vw;
      max-height: 85vh;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .settings-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .settings-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .settings-section {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-section h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 2px;
    }
    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .settings-row label {
      font-size: 0.78rem;
      color: #cbd5e1;
    }
    .settings-row input[type="text"],
    .settings-row input[type="password"],
    .settings-row input[type="number"],
    .settings-row select {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      color: white;
      font-size: 0.85rem;
    }
    .checkbox-row {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .settings-footer {
      padding: 12px 18px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .mcp-servers-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mcp-server-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }
    .mcp-server-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mcp-server-name {
      font-size: 0.85rem;
      color: #f8fafc;
    }
    .mcp-server-type {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

      display: flex;
      flex-direction: column;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 8px;
      overflow: hidden;
    }
    .chat-messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg-bubble {
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .chat-msg-ai {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .chat-msg-partial {
      font-style: italic;
      color: #94a3b8;
      opacity: 0.8;
    }
    .chat-msg-sender {
      font-size: 0.75rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 4px;
    }
    .chat-msg-time {
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 400;
    }
    .chat-msg-text {
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .tool-approval-card {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .approval-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .approval-badge {
      font-size: 0.7rem;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 0.05em;
    }
    .approval-tool {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #fbbf24;
    }
    .approval-args {
      font-family: monospace;
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 4px;
      color: #cbd5e1;
      overflow-x: auto;
    }
    .approval-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-approve {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-dismiss {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }
    .chat-input-bar {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chat-input-bar input {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      color: white;
    }
    .chat-input-bar button {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }


    /* Keyframe Animations for Soft Smooth Transitions */
    @keyframes fadeInSlideUp {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Custom Integrated Header / Titlebar - Fully Responsive */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      -webkit-app-region: drag;
      min-height: 44px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .signaling-select {
      background: rgba(15, 23, 42, 0.85);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease-out;
    }

    .signaling-select:hover {
      border-color: #818cf8;
      background: rgba(30, 41, 59, 0.95);
      color: white;
    }

    .btn-new-win {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease-out;
      white-space: nowrap;
    }

    .btn-new-win:hover {
      background: rgba(99, 102, 241, 0.3);
      color: white;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.4s ease-out;
    }

    .status-badge.hosting {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.25);
    }

    .status-badge.expired {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-color);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    .status-dot.hosting {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .status-dot.expired {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.6; transform: scale(0.9); }
    }

    /* Window Controls */
    .window-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease-out;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .win-btn-close:hover {
      background: #ef4444 !important;
      color: white !important;
    }

    /* App Body - Responsive Layout */
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
    }

    .app-main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vh, 20px) clamp(12px, 3vw, 24px);
      overflow-y: auto;
      height: 100%;
      position: relative;
    }

    /* Segmented Tab Controls - Soft Fade Transition */
    .nav-tabs {
      display: flex;
      align-self: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      gap: 4px;
      width: 100%;
      max-width: 480px;
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: clamp(0.75rem, 1.5vw, 0.82rem);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.35s ease-out, color 0.35s ease-out, box-shadow 0.35s ease-out;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .compact-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: clamp(14px, 2vh, 20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .card-title {
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      font-weight: 700;
    }

    .card-subtitle {
      font-size: clamp(0.72rem, 1.5vw, 0.78rem);
      color: var(--text-muted);
      margin-top: 1px;
    }

    .sources-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.3s ease-out;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .source-card {
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease-out;
      position: relative;
    }

    .source-card:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }

    .source-card.selected {
      border-color: #818cf8;
      background: rgba(99, 102, 241, 0.25);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
    }

    .source-card img {
      width: 100%;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
    }

    .source-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #a78bfa;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .source-card span {
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .info-note {
      font-size: 0.74rem;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      line-height: 1.3;
    }

    .toggle-group {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(15, 23, 42, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .toggle-label input[type="checkbox"] {
      accent-color: #6366f1;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .btn {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: clamp(0.85rem, 1.8vw, 0.92rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease-out;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      width: 100%;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      box-shadow: none;
      width: auto;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-danger {
      background: var(--danger-color);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      width: auto;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .code-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px dashed rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      animation: fadeInSlideUp 0.45s ease-out forwards;
      transition: all 0.4s ease-out;
    }

    .code-val {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: #a78bfa;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 14px rgba(167, 139, 250, 0.4);
      word-break: break-all;
    }

    .code-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: #f8fafc;
      text-align: center;
      outline: none;
      transition: all 0.3s ease-out;
      font-family: 'Courier New', monospace;
      user-select: text;
    }

    .code-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.3);
    }

    /* Active Session Fullscreen Stream View */
    .session-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: black;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--glass-border);
      animation: fadeInSlideUp 0.5s ease-out forwards;
    }

    .video-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 82vh;
      object-fit: contain;
    }

    /* Active Session Stream View Controls - Ultra Modern & Compact */
    .control-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 5px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 10;
      animation: fadeInSlideUp 0.45s ease-out forwards;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease-out;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .ctrl-btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .ctrl-btn-danger:hover {
      background: rgba(239, 68, 68, 0.85);
      color: white;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    /* Ultra-Modern Glassmorphic Modal Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.78);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeInSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 22px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      animation: fadeInSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-icon {
      width: 32px;
      height: 32px;
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-body {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .brand-title { display: none; }
      .btn-new-win { font-size: 0.7rem; padding: 3px 6px; }
      .control-bar { bottom: 10px; padding: 4px 8px; gap: 6px; }
      .ctrl-btn { font-size: 0.7rem; padding: 4px 8px; }
    }
    /* Side Drawer Panel (Chat & Media Sidebar) */
    .side-drawer {
      position: relative;
      width: 340px;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 5;
      animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .drawer-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.4);
    }

    .drawer-tabs {
      display: flex;
      gap: 6px;
    }

    .drawer-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drawer-tab-btn.active {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.4);
    }

    .btn-close-drawer {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .btn-close-drawer:hover {
      color: white;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .messages-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      margin-bottom: 10px;
    }

    .message-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .message-bubble.local {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message-bubble.remote {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 2px;
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      opacity: 0.75;
      margin-bottom: 3px;
      gap: 8px;
    }

    .chat-action-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chat-action-btn {
      background: rgba(30, 41, 59, 0.8);
      color: #818cf8;
      border: 1px solid var(--glass-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chat-action-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      color: white;
      border-color: #818cf8;
    }

    .inline-file-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .inline-clipboard-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      padding: 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .clipboard-header-tag {
      font-size: 0.68rem;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .clipboard-text-snippet {
      font-family: monospace;
      font-size: 0.76rem;
      color: var(--text-main);
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .btn-copy-snippet {
      width: 100%;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copy-snippet:hover {
      background: #6366f1;
      color: white;
    }

    .chat-input-form {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 0.8rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: #818cf8;
    }

    .btn-send-chat {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Files Panel */
    .files-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-upload-box {
      border: 2px dashed rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.05);
      border-radius: 10px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-upload-box:hover {
      border-color: #818cf8;
      background: rgba(99, 102, 241, 0.12);
    }

    .file-upload-box span {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
    }

    .file-upload-box p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin: 0;
    }

    .file-item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--glass-border);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .file-info {
      flex: 1;
      overflow: hidden;
    }

    .file-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .btn-download-file {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    /* Clipboard Panel */
    .clipboard-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clipboard-textarea {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.8rem;
      resize: vertical;
      outline: none;
    }

    .clipboard-textarea:focus {
      border-color: #818cf8;
    }

    .clipboard-actions {
      display: flex;
      gap: 10px;
    }
